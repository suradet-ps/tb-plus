# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
ignore = [
  # unic-* crates: transitive deps of tauri-utils, no safe upgrade available
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  # gtk-rs GTK3 bindings: transitive deps of tauri, no upgrade path
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",
  # proc-macro-error: dep of glib-macros, no upgrade path
  "RUSTSEC-2024-0370",
  # zbus_names/zvariant/zvariant_derive were folded into zbus 6.0. keyring
  # 4.1.6 (via encryptman-keyring) and tauri-plugin-opener still pin zbus 5.x,
  # and no patched 5.x release exists. Revisit when they migrate to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6; keyring 4.1.6 and tauri-plugin-opener still pin zbus 5.x with no patched release" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6; keyring 4.1.6 and tauri-plugin-opener still pin zbus 5.x with no patched release" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6; keyring 4.1.6 and tauri-plugin-opener still pin zbus 5.x with no patched release" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "0BSD",
  "MPL-2.0",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "Apache-2.0 WITH LLVM-exception",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
