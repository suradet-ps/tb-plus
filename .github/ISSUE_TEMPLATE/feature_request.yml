name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, missing, or slow in the TB clinic's daily work?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This keeps HOSxP read-only (no INSERT / UPDATE / DELETE / DDL).
          required: true
        - label: This does not log or expose PII (HN, CID, patient names).
          required: true
        - label: This keeps clinic data in the local SQLite database - nothing is sent to a cloud service.
          required: true
